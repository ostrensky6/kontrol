name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Reconstruir o banco local a partir das migrations
        run: |
          supabase start
          supabase db reset --no-seed

      - name: Validar permissoes reais dos cadastros
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/rls_cadastros_0108.sql

      - name: Validar edição e exclusão de planejamento
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/planejamento_edicao_exclusao_0111.sql

      - name: Validar baixa de embalagens fechadas
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/baixa_manual_embalagens_0110.sql

      - name: Validar proteção do salário dos técnicos
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/salario_tecnicos_0112.sql

      - name: Validar integridade do estoque e acesso anônimo
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/integridade_estoque_0120.sql

      - name: Validar permissões de orçamento (papel ou permissão)
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/orcamento_permissoes_0121.sql

      - name: Validar planejamento da proposta aprovada e registro da retirada
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/plano_da_proposta_0122.sql

      - name: Validar compra e recebimento em frascos
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/recebimento_frascos_0123.sql

      - name: Validar permissões (a caixinha manda)
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/permissoes_0124.sql

      - name: Validar item de pedido interno e travas da reposição
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/pedido_interno_itens_0125.sql

      - name: Validar permissões, auditoria e notificações por usuário
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/permissoes_auditoria_0128.sql

      - name: Validar integridade dos cadastros (exclusão com vínculo, técnico ativo, faixas)
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/cadastros_integridade_0129.sql

      - name: Validar ciclo físico do insumo (compra, recebimento, lote, reserva, estorno)
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/estoque_ciclo_0127.sql

      - name: Validar versões da proposta, link público e plano da aprovada
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/orcamento_versoes_0126.sql

      - name: Validar entrada direta, reposição com prazo total, compra atrasada e margem do plano
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/entrada_reposicao_compra_0130.sql

      - name: Validar claims vazios depois do commit e preservar autorização
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/claims_vazio_0131.sql

      - name: Validar link público no servidor, senha provisória, validade e reposição pendente
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/link_senha_reposicao_0132.sql

      - name: Validar quantidades conferidas no pedido de faltas e embalagem na compra
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/quantidades_conferidas_0133.sql

      - name: Validar registro dos backups e aviso de atraso
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/registro_backups_0134.sql

      - name: Validar catálogo vivo de custos de projeto (item novo, último vence, pessoal pendente)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/catalogo_vivo_projeto_0137.sql

      - name: Validar edição do catálogo de custos de projeto (criar, editar, unificar, histórico)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/catalogo_edicao_0138.sql

      - name: Validar reabrir, reformulação, modelos, pendências de pessoal e importação do catálogo
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/reformulacao_modelos_0139.sql

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir base do versionamento
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            echo "::error::SHA base ausente ou all-zero; versionamento nao pode ser comprovado."
            exit 1
          fi
          echo "APP_VERSION_BASE_REF=$base" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Validar incremento da versao
        run: |
          npm run version:test
          npm run db:migration:test
          npm run backup:test
          npm run version:check -- "$APP_VERSION_BASE_REF"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome

      - name: Validar tipo, lint, testes, build e E2E
        run: npm run verify
        env:
          # o webServer do Playwright sobe `npm run dev` com mock do Supabase;
          # estes valores são fictícios e nunca tocam o banco real.
          PLAYWRIGHT_MOCK_SUPABASE: "1"
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: output/playwright-report
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          # valores fictícios — as páginas são dinâmicas e não acessam o banco no build
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
