name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Reconstruir o banco local a partir das migrations
        run: |
          supabase start
          supabase db reset --no-seed

      - name: Validar seis funções, CHECKs, RBAC e alias histórico
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v kontrol_test_local=1 < supabase/tests/seis_funcoes_0146.sql

      - name: Validar exclusão definitiva por privilégio (0147)
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v kontrol_test_local=1 < supabase/tests/exclusao_por_privilegio_0147.sql

      - name: Validar permissoes reais dos cadastros
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/rls_cadastros_0108.sql

      - name: Validar edição e exclusão de planejamento
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/planejamento_edicao_exclusao_0111.sql

      - name: Validar baixa de embalagens fechadas
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/baixa_manual_embalagens_0110.sql

      - name: Validar proteção do salário dos técnicos
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/salario_tecnicos_0112.sql

      - name: Validar integridade do estoque e acesso anônimo
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/integridade_estoque_0120.sql

      - name: Validar permissões de orçamento (papel ou permissão)
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/orcamento_permissoes_0121.sql

      - name: Validar planejamento da proposta aprovada e registro da retirada
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/plano_da_proposta_0122.sql

      - name: Validar compra e recebimento em frascos
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/recebimento_frascos_0123.sql

      - name: Validar permissões (a caixinha manda)
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/permissoes_0124.sql

      - name: Validar item de pedido interno e travas da reposição
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/pedido_interno_itens_0125.sql

      - name: Validar permissões, auditoria e notificações por usuário
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/permissoes_auditoria_0128.sql

      - name: Validar integridade dos cadastros (exclusão com vínculo, técnico ativo, faixas)
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/cadastros_integridade_0129.sql

      - name: Validar ciclo físico do insumo (compra, recebimento, lote, reserva, estorno)
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/estoque_ciclo_0127.sql

      - name: Validar versões da proposta, link público e plano da aprovada
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/orcamento_versoes_0126.sql

      - name: Validar entrada direta, reposição com prazo total, compra atrasada e margem do plano
        run: docker exec -i supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/entrada_reposicao_compra_0130.sql

      - name: Validar claims vazios depois do commit e preservar autorização
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/claims_vazio_0131.sql

      - name: Validar link público no servidor, senha provisória, validade e reposição pendente
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/link_senha_reposicao_0132.sql

      - name: Validar quantidades conferidas no pedido de faltas e embalagem na compra
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/quantidades_conferidas_0133.sql

      - name: Validar registro dos backups e aviso de atraso
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/registro_backups_0134.sql

      - name: Validar decisões D2, D3, D5 e D7 (autoaprovação, coordenador, inventário)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/decisoes_d2_d3_d5_d7_0136.sql

      - name: Validar catálogo vivo de custos de projeto (item novo, último vence, pessoal pendente)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/catalogo_vivo_projeto_0137.sql

      - name: Validar edição do catálogo de custos de projeto (criar, editar, unificar, histórico)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/catalogo_edicao_0138.sql

      - name: Validar reabrir, reformulação, modelos, pendências de pessoal e importação do catálogo
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/reformulacao_modelos_0139.sql

      - name: Validar pessoal (PE) nas linhas de custo de projeto só com a permissão
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/pessoal_linhas_projeto_0140.sql

      - name: Validar registro de erros do app e aviso ao administrador
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/registro_erros_0141.sql

      - name: Validar anexos restritos por permissão e proposta cancelada aprovável de novo
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/anexos_proposta_cancelada_0142.sql

      - name: Validar entrada e saída por leitura de código de barras e inventário por insumo
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/leitura_codigo_barras_0143.sql

      - name: Validar inativação de insumos sem apagar histórico (0144)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v kontrol_test_local=1 < supabase/tests/inativacao_insumos_0144.sql

      - name: Validar exclusão de insumo em cascata com auditoria (0145)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v kontrol_test_local=1 < supabase/tests/excluir_insumo_em_cascata_0145.sql

      - name: Validar registro de leituras protegido e auditoria da cascata (0148)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/registro_leituras_0148.sql

      - name: Validar base do catálogo de funções e estimativa manual de consumo (0151, 0152)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v kontrol_test_local=1 < supabase/tests/consumo_manual_insumos_0152.sql

      - name: Validar consumo mensal automático e exclusão com estimativa (0157)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v kontrol_test_local=1 < supabase/tests/consumo_mensal_automatico_0157.sql

      - name: Validar avisos de manutenção e calibração de equipamentos (0158)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v kontrol_test_local=1 < supabase/tests/equipamentos_avisos_0158.sql

      - name: Validar validação de alternativas de insumo (0159)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v kontrol_test_local=1 < supabase/tests/alternativas_validadas_0159.sql

      - name: Validar Supervisor e vínculos de projeto (0160)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v kontrol_test_local=1 < supabase/tests/supervisor_vinculos_0160.sql

      - name: Validar custo de equipamento de parceiro (0161)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v kontrol_test_local=1 < supabase/tests/equipamento_parceiro_0161.sql

      - name: Validar incidentes (0162)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v kontrol_test_local=1 < supabase/tests/incidentes_0162.sql

      - name: Validar disputa de reservas (0163)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v kontrol_test_local=1 < supabase/tests/disputa_reservas_0163.sql

      - name: Validar ciclo da proposta e memória de cálculo (0164)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v kontrol_test_local=1 < supabase/tests/ciclo_proposta_0164.sql

      - name: Validar leitura de compras pela caixinha (0166)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v kontrol_test_local=1 < supabase/tests/leitura_compras_0166.sql

      - name: Validar vínculo de projeto e último Administrador (0151)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v kontrol_test_local=1 < supabase/tests/funcoes_base_0151.sql

      - name: Validar correções de banco da auditoria de 08/11 (0167)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v kontrol_test_local=1 < supabase/tests/auditoria_banco_0167.sql

      - name: Validar campos da solicitação e sinônimos (0168)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/solicitacao_0168.sql
      - name: Validar aprovação por competência (0169)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/aprovacao_competencia_0169.sql
      - name: Validar caminho único e entrega antes do pagamento (0170)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/caminho_unico_pagamento_0170.sql
      - name: Validar três orçamentos (0171)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/tres_orcamentos_0171.sql
      - name: Validar ciclo do dia 10 e urgência (0172)
        run: docker exec -i -e PGCLIENTENCODING=UTF8 supabase_db_Estoque psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/ciclo_dia_10_0172.sql

  e2e-real:
    # E2E contra banco REAL: Supabase local (Docker) com todas as migrations,
    # Auth, PostgREST e RLS. Nunca toca produção: as chaves são as do Supabase
    # local e o preparo recusa qualquer host fora de 127.0.0.1.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Subir o Supabase local e aplicar as migrations
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
          supabase db reset --no-seed

      - name: Exportar URL e chaves do Supabase local
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_REAL_SENHA=e2e-$(openssl rand -hex 12)"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          # supabase-js (usado no preparo e nos testes) exige WebSocket nativo: Node 22+.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Criar usuários de teste no banco local
        run: npm run test:e2e:real:prep

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome

      - name: Build contra o Supabase local
        run: npm run build

      - name: E2E contra banco real
        run: npm run test:e2e:real

      - name: Upload Playwright report (banco real)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-real-report
          path: |
            output/playwright-real-report
            output/playwright-real
          retention-days: 7

  check:
    # ubuntu-latest passou a ser 26.04 em nov/2026 e o Playwright ainda não
    # instala o ffmpeg nela ("does not support ffmpeg on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir base do versionamento
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            echo "::error::SHA base ausente ou all-zero; versionamento nao pode ser comprovado."
            exit 1
          fi
          echo "APP_VERSION_BASE_REF=$base" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Validar incremento da versao
        run: |
          npm run version:test
          npm run db:migration:test
          npm run backup:test
          node --test scripts/e2e-real-preparar.test.mjs
          npm run version:check -- "$APP_VERSION_BASE_REF"

      - name: Validar guardas estáticas da inativação de insumos (0144)
        run: node --test supabase/tests/inativacao_insumos_0144.test.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome

      - name: Validar tipo, lint, testes, build e E2E
        run: npm run verify
        env:
          # o webServer do Playwright sobe `npm run dev` com mock do Supabase;
          # estes valores são fictícios e nunca tocam o banco real.
          PLAYWRIGHT_MOCK_SUPABASE: "1"
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: output/playwright-report
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          # valores fictícios — as páginas são dinâmicas e não acessam o banco no build
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
